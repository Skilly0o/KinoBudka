{% extends 'base.html' %}

{% block title %}
KinBu
{% endblock %}

{% block body %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/films.css') }}">
  <div class="film-form">
      <form action="#" method="post">
        <input type="text" name="filmname" class="film-input" placeholder="Фильмы, сериалы">
      </form>
  </div>
  <div class="movies">
    {% if lenmovies == 0 %}
      <h3 class="text-white">Ничего не найдено</h3>
    {% else %}
      {% for movie in movies %}
        <a class="amovie" href="/movie?video_url={{ movie.link }}&title={{ movie.title | urlencode }}&poster_url={{ movie.poster_url | urlencode }}&description={{ movie.description | urlencode }}&year={{ movie.year }}">

  <img src="{{ movie.poster_url }}" alt="{{ movie.title }}">
  <p class="film-title">{{ movie.title }}</p>
        </a>
      {% endfor %}
    {% endif %}
  </div>
{% endblock %}
